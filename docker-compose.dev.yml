services:
  wallbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wallbot-dev
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - SEARCH_INTERVAL=${SEARCH_INTERVAL:-300}
      - PROFILE=dev  # Enable development mode
    volumes:
      - ./data:/data            # Bind mount: database stored in ./data directory
      - ./logs:/logs            # Bind mount: logs stored in ./logs directory
      - ./src:/app/src          # Mount source for development
    networks:
      - wallbot-network

networks:
  wallbot-network:
    driver: bridge
